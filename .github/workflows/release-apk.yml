name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Rename APK
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        cp app/build/outputs/apk/debug/app-debug.apk "CustomBrowser-${VERSION}.apk"

    - name: Get APK Info
      run: |
        VERSION="${{ github.event.inputs.version || github.ref_name }}"
        echo "📦 APK Information" >> $GITHUB_STEP_SUMMARY
        echo "==================" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
        echo "**Size:** $(ls -lh CustomBrowser-${VERSION}.apk | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
        echo "**Build Date:** $(date)" >> $GITHUB_STEP_SUMMARY

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: CustomBrowser-Release
        path: CustomBrowser-*.apk
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: CustomBrowser-*.apk
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
